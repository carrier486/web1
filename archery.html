<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏹 양궁 대결 - Archery PvP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 1000px;
            height: 700px;
            background: #000;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            cursor: crosshair;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }

        .player-panel {
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 10px;
            min-width: 180px;
            backdrop-filter: blur(5px);
        }

        .player-panel.active {
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .player-panel h3 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .player-panel.p1 h3 { color: #ff6b6b; }
        .player-panel.p2 h3 { color: #4ecdc4; }

        .score-display {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
        }

        .arrows-display {
            margin-top: 8px;
            font-size: 14px;
            color: #aaa;
        }

        .arrow-scores {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .arrow-score {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            background: #333;
            color: #666;
        }

        .arrow-score.hit {
            background: #ffd700;
            color: #000;
        }

        .arrow-score.ten {
            background: #ff4444;
            color: #fff;
        }

        #roundInfo {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 10px 25px;
            border-radius: 20px;
            color: #fff;
            font-size: 16px;
            z-index: 10;
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        #startScreen, #resultScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #startScreen h1, #resultScreen h1 {
            font-size: 48px;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        #startScreen p {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 16px;
            text-align: center;
            line-height: 1.8;
        }

        .btn {
            padding: 15px 40px;
            font-size: 18px;
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            border: none;
            border-radius: 30px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            pointer-events: auto;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
        }

        #resultScreen .winner {
            font-size: 72px;
            margin-bottom: 10px;
        }

        #resultScreen .winner-text {
            font-size: 32px;
            color: #fff;
            margin-bottom: 30px;
        }

        .final-scores {
            display: flex;
            gap: 50px;
            margin-bottom: 30px;
        }

        .final-score-panel {
            text-align: center;
            padding: 20px 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
        }

        .final-score-panel h3 {
            color: #fff;
            margin-bottom: 10px;
        }

        .final-score-panel .score {
            font-size: 48px;
            font-weight: bold;
            color: #ffd700;
        }

        .round-results {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 14px;
        }

        #closeupOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        #closeupCanvas {
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
        }

        #closeupScore {
            position: absolute;
            bottom: 100px;
            font-size: 64px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1000" height="700"></canvas>

        <div id="ui">
            <div class="player-panel p1" id="p1Panel">
                <h3>🏹 Player 1</h3>
                <div class="score-display" id="p1Score">0</div>
                <div class="arrows-display">화살: <span id="p1Arrows">3</span>/3</div>
                <div class="arrow-scores" id="p1ArrowScores">
                    <div class="arrow-score">-</div>
                    <div class="arrow-score">-</div>
                    <div class="arrow-score">-</div>
                </div>
            </div>

            <div class="player-panel p2" id="p2Panel">
                <h3>🏹 Player 2</h3>
                <div class="score-display" id="p2Score">0</div>
                <div class="arrows-display">화살: <span id="p2Arrows">3</span>/3</div>
                <div class="arrow-scores" id="p2ArrowScores">
                    <div class="arrow-score">-</div>
                    <div class="arrow-score">-</div>
                    <div class="arrow-score">-</div>
                </div>
            </div>
        </div>

        <div id="roundInfo">라운드 1 / 3</div>

        <div id="instructions">클릭하고 드래그하여 조준 → 놓으면 발사!</div>

        <div id="closeupOverlay">
            <canvas id="closeupCanvas" width="300" height="300"></canvas>
            <div id="closeupScore">10</div>
        </div>

        <div id="startScreen">
            <h1>🏹 양궁 대결</h1>
            <p>
                1대1 양궁 대결 게임<br>
                각 라운드 3발씩 발사하여 점수 합산<br>
                3라운드 진행 후 총점으로 승부!<br><br>
                마우스 클릭 → 드래그로 조준 → 놓으면 발사
            </p>
            <button class="btn" id="startBtn">게임 시작</button>
        </div>

        <div id="resultScreen" style="display: none;">
            <div class="winner" id="winnerEmoji">🏆</div>
            <h1 id="winnerText">Player 1 승리!</h1>
            <div class="final-scores">
                <div class="final-score-panel">
                    <h3>Player 1</h3>
                    <div class="score" id="finalP1">0</div>
                </div>
                <div class="final-score-panel">
                    <h3>Player 2</h3>
                    <div class="score" id="finalP2">0</div>
                </div>
            </div>
            <div class="round-results" id="roundResults"></div>
            <button class="btn" id="restartBtn">다시 하기</button>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const closeupCanvas = document.getElementById('closeupCanvas');
        const closeupCtx = closeupCanvas.getContext('2d');

        // Game state
        let gameState = 'start';
        let currentPlayer = 1;
        let currentRound = 1;
        const maxRounds = 3;
        const arrowsPerRound = 3;

        let players = {
            1: { score: 0, roundScores: [], currentArrows: [], arrowsLeft: 3, wins: 0 },
            2: { score: 0, roundScores: [], currentArrows: [], arrowsLeft: 3, wins: 0 }
        };

        // Aiming state
        let isAiming = false;
        let aimStartTime = 0;
        let aimX = 500;
        let aimY = 280;
        let drawStrength = 0;
        let maxDrawStrength = 100;
        let mouseX = 500;
        let mouseY = 280;

        // Arrow state
        let arrow = null;
        let arrowTrail = [];
        let arrowsOnTarget = [];

        // Target settings
        const target = {
            x: 500,
            y: 280,
            baseRadius: 120,
            distance: 70,
            rings: [
                { radius: 1.0, color: '#fff', score: 1 },
                { radius: 0.9, color: '#fff', score: 2 },
                { radius: 0.8, color: '#000', score: 3 },
                { radius: 0.7, color: '#000', score: 4 },
                { radius: 0.6, color: '#4a9eff', score: 5 },
                { radius: 0.5, color: '#4a9eff', score: 6 },
                { radius: 0.4, color: '#ff4444', score: 7 },
                { radius: 0.3, color: '#ff4444', score: 8 },
                { radius: 0.2, color: '#ffd700', score: 9 },
                { radius: 0.1, color: '#ffd700', score: 10 }
            ]
        };

        // Wind system
        let wind = { x: 0, y: 0, speed: 0, angle: 0 };
        let windAnimTime = 0;

        // Subtle sway for aiming
        let swayTime = 0;
        let swayOffsetX = 0;
        let swayOffsetY = 0;

        // Initialize
        function init() {
            resetRound();
            updateUI();
            gameLoop();
        }

        function resetGame() {
            currentPlayer = 1;
            currentRound = 1;
            players = {
                1: { score: 0, roundScores: [], currentArrows: [], arrowsLeft: 3, wins: 0 },
                2: { score: 0, roundScores: [], currentArrows: [], arrowsLeft: 3, wins: 0 }
            };
            arrowsOnTarget = [];
            resetRound();
            updateUI();
        }

        function resetRound() {
            players[1].arrowsLeft = arrowsPerRound;
            players[2].arrowsLeft = arrowsPerRound;
            players[1].currentArrows = [];
            players[2].currentArrows = [];
            arrowsOnTarget = [];
            generateWind();
        }

        function generateWind() {
            wind.speed = Math.random() * 5 + 0.5; // 0.5 ~ 5.5 m/s
            wind.angle = Math.random() * Math.PI * 2; // Random direction
            wind.x = Math.cos(wind.angle) * wind.speed;
            wind.y = Math.sin(wind.angle) * wind.speed * 0.3; // Less vertical effect
        }

        // Drawing functions
        function drawBackground() {
            // Sky gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, 400);
            skyGradient.addColorStop(0, '#87CEEB');
            skyGradient.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, 1000, 400);

            // Clouds affected by wind
            drawClouds();

            // Ground
            const groundGradient = ctx.createLinearGradient(0, 400, 0, 700);
            groundGradient.addColorStop(0, '#4a7c23');
            groundGradient.addColorStop(1, '#2d5016');
            ctx.fillStyle = groundGradient;
            ctx.fillRect(0, 400, 1000, 300);

            // Grass movement with wind
            drawGrass();

            // Lane lines
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            for (let i = -2; i <= 2; i++) {
                ctx.beginPath();
                ctx.moveTo(500 + i * 200, 700);
                ctx.lineTo(500 + i * 20, 400);
                ctx.stroke();
            }

            // Distance marker
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('70m', 500, 390);
        }

        function drawClouds() {
            windAnimTime += 0.01;
            const cloudOffset = (windAnimTime * wind.x * 5) % 200;

            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            for (let i = 0; i < 5; i++) {
                const x = ((i * 250 + cloudOffset) % 1200) - 100;
                const y = 50 + i * 30;
                ctx.beginPath();
                ctx.arc(x, y, 30, 0, Math.PI * 2);
                ctx.arc(x + 25, y - 10, 25, 0, Math.PI * 2);
                ctx.arc(x + 50, y, 28, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawGrass() {
            const grassWave = Math.sin(windAnimTime * 3) * wind.speed * 2;
            ctx.strokeStyle = '#3d6b1e';
            ctx.lineWidth = 2;

            for (let x = 0; x < 1000; x += 15) {
                const waveOffset = Math.sin(x * 0.05 + windAnimTime * 2) * grassWave;
                ctx.beginPath();
                ctx.moveTo(x, 400);
                ctx.quadraticCurveTo(x + waveOffset, 390, x + waveOffset * 0.5, 385);
                ctx.stroke();
            }
        }

        function drawTarget() {
            const { x, y, baseRadius, rings } = target;

            // Target stand
            ctx.fillStyle = '#654321';
            ctx.fillRect(x - 5, y + baseRadius, 10, 80);
            ctx.fillRect(x - 40, y + baseRadius + 70, 80, 10);

            // Draw rings
            for (let i = 0; i < rings.length; i++) {
                const ring = rings[i];
                const radius = baseRadius * ring.radius;

                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = ring.color;
                ctx.fill();
                ctx.strokeStyle = i < 2 ? '#ccc' : (ring.color === '#000' ? '#333' : '#000');
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Center X
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x - 5, y - 5);
            ctx.lineTo(x + 5, y + 5);
            ctx.moveTo(x + 5, y - 5);
            ctx.lineTo(x - 5, y + 5);
            ctx.stroke();

            // Draw arrows on target
            arrowsOnTarget.forEach(arr => {
                drawArrowOnTarget(arr.x, arr.y, arr.player);
            });
        }

        function drawArrowOnTarget(ax, ay, player) {
            const color = player === 1 ? '#ff6b6b' : '#4ecdc4';

            ctx.beginPath();
            ctx.arc(ax, ay, 4, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Fletching sticking out
            ctx.beginPath();
            ctx.moveTo(ax, ay);
            ctx.lineTo(ax - 12, ay - 6);
            ctx.lineTo(ax - 10, ay);
            ctx.lineTo(ax - 12, ay + 6);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawBow() {
            const bowCenterX = 180;
            const bowCenterY = 500;

            // Aim offset - bow follows mouse slightly
            const aimOffsetX = (mouseX - 500) * 0.03;
            const aimOffsetY = (mouseY - 280) * 0.03;

            ctx.save();
            ctx.translate(bowCenterX + aimOffsetX, bowCenterY + aimOffsetY);

            // Tilt the bow - angled like real archery (about 15 degrees)
            ctx.rotate(-0.25); // Slight tilt to the left

            const drawPull = isAiming ? Math.min(drawStrength / maxDrawStrength, 1) : 0;

            // Bow riser (handle) - vertical orientation
            ctx.fillStyle = '#2d1810';
            ctx.beginPath();
            ctx.roundRect(-12, -40, 24, 80, 5);
            ctx.fill();

            // Grip wrapping
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(-10, -20, 20, 50);

            // Grip texture lines
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 1;
            for (let i = -15; i < 30; i += 5) {
                ctx.beginPath();
                ctx.moveTo(-8, i);
                ctx.lineTo(8, i);
                ctx.stroke();
            }

            // Upper limb
            ctx.beginPath();
            ctx.moveTo(0, -40);
            const upperBend = drawPull * 25;
            ctx.quadraticCurveTo(35 - upperBend, -120, 20 - upperBend * 0.5, -180);
            ctx.strokeStyle = '#1a0f0a';
            ctx.lineWidth = 14;
            ctx.stroke();
            ctx.strokeStyle = '#4a3528';
            ctx.lineWidth = 10;
            ctx.stroke();
            ctx.strokeStyle = '#6b4c3a';
            ctx.lineWidth = 6;
            ctx.stroke();

            // Lower limb
            ctx.beginPath();
            ctx.moveTo(0, 40);
            ctx.quadraticCurveTo(35 - upperBend, 120, 20 - upperBend * 0.5, 180);
            ctx.strokeStyle = '#1a0f0a';
            ctx.lineWidth = 14;
            ctx.stroke();
            ctx.strokeStyle = '#4a3528';
            ctx.lineWidth = 10;
            ctx.stroke();
            ctx.strokeStyle = '#6b4c3a';
            ctx.lineWidth = 6;
            ctx.stroke();

            // Limb tips
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(20 - upperBend * 0.5, -180, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(20 - upperBend * 0.5, 180, 5, 0, Math.PI * 2);
            ctx.fill();

            // Bowstring
            const stringPullX = drawPull * 80;
            ctx.beginPath();
            ctx.moveTo(20 - upperBend * 0.5, -178);
            ctx.lineTo(55 + stringPullX, 0); // String pulled back
            ctx.lineTo(20 - upperBend * 0.5, 178);
            ctx.strokeStyle = '#e8e8e8';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Arrow on bow when aiming
            if (isAiming && drawStrength > 10) {
                const arrowStartX = 55 + stringPullX;
                const arrowEndX = arrowStartX - 280;

                // Arrow shaft
                ctx.beginPath();
                ctx.moveTo(arrowStartX, 0);
                ctx.lineTo(arrowEndX, 0);
                ctx.strokeStyle = '#c4a574';
                ctx.lineWidth = 5;
                ctx.stroke();
                ctx.strokeStyle = '#8B6914';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Arrowhead
                ctx.beginPath();
                ctx.moveTo(arrowEndX - 20, 0);
                ctx.lineTo(arrowEndX, -8);
                ctx.lineTo(arrowEndX, 8);
                ctx.closePath();
                ctx.fillStyle = '#555';
                ctx.fill();

                // Fletching
                const fletchX = arrowStartX - 20;
                ctx.fillStyle = '#cc3333';
                ctx.beginPath();
                ctx.moveTo(fletchX, 0);
                ctx.lineTo(fletchX + 35, -12);
                ctx.lineTo(fletchX + 40, 0);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(fletchX, 0);
                ctx.lineTo(fletchX + 35, 12);
                ctx.lineTo(fletchX + 40, 0);
                ctx.fill();

                // Nock
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(arrowStartX, 0, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // Archer's hand on string when aiming
            if (isAiming) {
                ctx.fillStyle = '#e0b090';
                ctx.beginPath();
                ctx.ellipse(55 + stringPullX + 10, 0, 15, 20, 0, 0, Math.PI * 2);
                ctx.fill();

                // Fingers
                ctx.strokeStyle = '#d4a07a';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(55 + stringPullX + 5, -8);
                ctx.lineTo(55 + stringPullX - 5, -12);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(55 + stringPullX + 5, 0);
                ctx.lineTo(55 + stringPullX - 8, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(55 + stringPullX + 5, 8);
                ctx.lineTo(55 + stringPullX - 5, 12);
                ctx.stroke();
            }

            ctx.restore();

            // Power meter
            if (isAiming) {
                drawPowerMeter();
            }
        }

        function drawPowerMeter() {
            const meterX = 50;
            const meterY = 250;
            const meterHeight = 200;
            const meterWidth = 25;

            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.beginPath();
            ctx.roundRect(meterX - 8, meterY - 30, meterWidth + 16, meterHeight + 50, 10);
            ctx.fill();

            ctx.fillStyle = '#222';
            ctx.fillRect(meterX, meterY, meterWidth, meterHeight);

            const powerHeight = (drawStrength / maxDrawStrength) * meterHeight;
            const powerGradient = ctx.createLinearGradient(0, meterY + meterHeight, 0, meterY);
            powerGradient.addColorStop(0, '#22cc22');
            powerGradient.addColorStop(0.4, '#88cc22');
            powerGradient.addColorStop(0.7, '#cccc22');
            powerGradient.addColorStop(1, '#cc4422');
            ctx.fillStyle = powerGradient;
            ctx.fillRect(meterX, meterY + meterHeight - powerHeight, meterWidth, powerHeight);

            // Optimal zone marker (60-80%)
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            const optimalTop = meterY + meterHeight * 0.2;
            const optimalHeight = meterHeight * 0.2;
            ctx.strokeRect(meterX - 3, optimalTop, meterWidth + 6, optimalHeight);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('BEST', meterX + meterWidth / 2, optimalTop - 5);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Arial';
            ctx.fillText('POWER', meterX + meterWidth / 2, meterY - 12);

            // Percentage
            const pct = Math.round(drawStrength);
            ctx.fillText(`${pct}%`, meterX + meterWidth / 2, meterY + meterHeight + 18);
        }

        function drawCrosshair() {
            if (!isAiming) return;

            // Subtle breathing sway - not spinning
            swayTime += 0.02;
            const breathCycle = Math.sin(swayTime * 0.8); // Slow breathing
            const microTremor = Math.sin(swayTime * 4) * 0.3; // Tiny hand tremor

            // Sway decreases with draw strength (more stable when fully drawn)
            const stabilityFactor = 1 - (drawStrength / maxDrawStrength) * 0.6;
            const swayAmount = 3 * stabilityFactor;

            swayOffsetX = (breathCycle * 2 + microTremor) * swayAmount;
            swayOffsetY = (Math.cos(swayTime * 0.6) * 1.5 + microTremor * 0.5) * swayAmount;

            const cx = mouseX + swayOffsetX;
            const cy = mouseY + swayOffsetY;

            // Simple crosshair - not spinning
            ctx.strokeStyle = 'rgba(255, 50, 50, 0.8)';
            ctx.lineWidth = 2;

            // Outer circle
            ctx.beginPath();
            ctx.arc(cx, cy, 25, 0, Math.PI * 2);
            ctx.stroke();

            // Inner circle
            ctx.beginPath();
            ctx.arc(cx, cy, 8, 0, Math.PI * 2);
            ctx.stroke();

            // Cross lines
            ctx.beginPath();
            ctx.moveTo(cx - 35, cy);
            ctx.lineTo(cx - 12, cy);
            ctx.moveTo(cx + 12, cy);
            ctx.lineTo(cx + 35, cy);
            ctx.moveTo(cx, cy - 35);
            ctx.lineTo(cx, cy - 12);
            ctx.moveTo(cx, cy + 12);
            ctx.lineTo(cx, cy + 35);
            ctx.stroke();

            // Center dot
            ctx.fillStyle = 'rgba(255, 50, 50, 0.9)';
            ctx.beginPath();
            ctx.arc(cx, cy, 3, 0, Math.PI * 2);
            ctx.fill();

            aimX = cx;
            aimY = cy;
        }

        function drawWindIndicator() {
            const wx = 900;
            const wy = 200;
            const size = 70;

            // Background panel
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.beginPath();
            ctx.roundRect(wx - size/2 - 15, wy - size/2 - 35, size + 30, size + 70, 10);
            ctx.fill();

            // Title
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('WIND', wx, wy - size/2 - 15);

            // Compass circle
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(wx, wy, size/2, 0, Math.PI * 2);
            ctx.stroke();

            // Compass directions
            ctx.fillStyle = '#888';
            ctx.font = '10px Arial';
            ctx.fillText('N', wx, wy - size/2 - 5);
            ctx.fillText('S', wx, wy + size/2 + 12);
            ctx.fillText('W', wx - size/2 - 8, wy + 4);
            ctx.fillText('E', wx + size/2 + 8, wy + 4);

            // Wind sock / arrow
            const arrowLen = Math.min(wind.speed * 6, size/2 - 5);

            ctx.save();
            ctx.translate(wx, wy);
            ctx.rotate(wind.angle);

            // Animated wind streaks
            const streakOffset = (windAnimTime * 20) % 15;
            ctx.strokeStyle = 'rgba(100, 180, 255, 0.4)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 3; i++) {
                const sx = -size/2 + i * 15 + streakOffset;
                ctx.beginPath();
                ctx.moveTo(sx, -3);
                ctx.lineTo(sx + 10, -3);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(sx + 5, 3);
                ctx.lineTo(sx + 15, 3);
                ctx.stroke();
            }

            // Main wind arrow
            ctx.beginPath();
            ctx.moveTo(-5, 0);
            ctx.lineTo(arrowLen, 0);
            ctx.strokeStyle = '#4a9eff';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Arrowhead
            ctx.beginPath();
            ctx.moveTo(arrowLen + 10, 0);
            ctx.lineTo(arrowLen - 5, -8);
            ctx.lineTo(arrowLen - 5, 8);
            ctx.closePath();
            ctx.fillStyle = '#4a9eff';
            ctx.fill();

            ctx.restore();

            // Wind speed text
            ctx.fillStyle = '#4a9eff';
            ctx.font = 'bold 16px Arial';
            ctx.fillText(`${wind.speed.toFixed(1)}`, wx, wy + size/2 + 30);
            ctx.font = '11px Arial';
            ctx.fillStyle = '#888';
            ctx.fillText('m/s', wx + 22, wy + size/2 + 30);

            // Wind strength indicator bars
            const bars = Math.ceil(wind.speed / 1.5);
            for (let i = 0; i < 4; i++) {
                ctx.fillStyle = i < bars ? '#4a9eff' : '#333';
                ctx.fillRect(wx - 25 + i * 14, wy + size/2 + 38, 10, 5);
            }
        }

        function drawFlyingArrow() {
            if (!arrow) return;

            // Draw trail
            if (arrowTrail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(arrowTrail[0].screenX, arrowTrail[0].screenY);
                for (let i = 1; i < arrowTrail.length; i++) {
                    ctx.lineTo(arrowTrail[i].screenX, arrowTrail[i].screenY);
                }
                ctx.strokeStyle = 'rgba(200, 150, 100, 0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            const { screenX, screenY, angle, scale } = arrow;
            const arrowLength = 40 * scale;
            const color = arrow.player === 1 ? '#ff6b6b' : '#4ecdc4';

            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(angle);

            // Arrow shaft
            ctx.beginPath();
            ctx.moveTo(-arrowLength, 0);
            ctx.lineTo(arrowLength * 0.3, 0);
            ctx.strokeStyle = '#c4a574';
            ctx.lineWidth = Math.max(3, 5 * scale);
            ctx.stroke();

            // Arrowhead
            ctx.beginPath();
            ctx.moveTo(-arrowLength - 15 * scale, 0);
            ctx.lineTo(-arrowLength, -6 * scale);
            ctx.lineTo(-arrowLength, 6 * scale);
            ctx.closePath();
            ctx.fillStyle = '#555';
            ctx.fill();

            // Fletching
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(arrowLength * 0.1, 0);
            ctx.lineTo(arrowLength * 0.4, -10 * scale);
            ctx.lineTo(arrowLength * 0.5, 0);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(arrowLength * 0.1, 0);
            ctx.lineTo(arrowLength * 0.4, 10 * scale);
            ctx.lineTo(arrowLength * 0.5, 0);
            ctx.fill();

            ctx.restore();

            // Shadow on ground
            if (arrow.worldY < 100) {
                const shadowY = 400 + arrow.z * 0.05;
                const shadowScale = 0.3 * scale;
                ctx.beginPath();
                ctx.ellipse(screenX, shadowY, 20 * shadowScale, 5 * shadowScale, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fill();
            }
        }

        function drawPlayerIndicator() {
            const playerColor = currentPlayer === 1 ? '#ff6b6b' : '#4ecdc4';
            ctx.fillStyle = playerColor;
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`Player ${currentPlayer}의 차례`, 500, 670);
        }

        // Game logic
        function shootArrow() {
            const power = Math.min(drawStrength / maxDrawStrength, 1);

            // Starting position (from bow)
            const startX = aimX;
            const startY = aimY;

            // Calculate initial velocity based on power and aim
            // The arrow should arc towards where you're aiming
            const targetDist = 70; // meters to target
            const flightTime = 1.5 - power * 0.3; // Higher power = faster

            // Initial velocity to hit the aim point considering gravity
            const gravity = 15;
            const vx = (target.x - startX) / (flightTime * 60); // Horizontal velocity
            const vy = ((target.y - startY) / (flightTime * 60)) - (gravity * flightTime * 60 / 2); // Compensate for gravity

            // Add aim offset (where player is actually aiming vs target center)
            const aimOffsetX = (aimX - target.x) / 50;
            const aimOffsetY = (aimY - target.y) / 50;

            arrow = {
                // World position
                x: startX,
                y: startY,
                z: 0, // Distance traveled

                // Velocity
                vx: vx + aimOffsetX,
                vy: vy + aimOffsetY,
                vz: 12 + power * 5, // Forward speed

                // Screen position (calculated)
                screenX: startX,
                screenY: startY,
                angle: 0,
                scale: 1,

                // For height calculation
                worldY: 0,

                // Tracking
                player: currentPlayer,
                power: power,
                flightTime: 0,
                maxZ: 800 // Target distance in "units"
            };

            arrowTrail = [];
            gameState = 'shooting';
            isAiming = false;
            drawStrength = 0;
        }

        function updateArrow() {
            if (!arrow) return;

            arrow.flightTime += 1;

            // Physics constants
            const gravity = 0.15;
            const windEffect = 0.02;
            const airResistance = 0.998;

            // Apply wind (more effect as arrow slows down)
            const windFactor = windEffect * (1 + arrow.flightTime * 0.01);
            arrow.vx += wind.x * windFactor;
            arrow.vy += wind.y * windFactor * 0.5;

            // Apply gravity
            arrow.vy += gravity;

            // Apply air resistance
            arrow.vx *= airResistance;
            arrow.vy *= airResistance;
            arrow.vz *= airResistance;

            // Update position
            arrow.x += arrow.vx;
            arrow.worldY += arrow.vy;
            arrow.z += arrow.vz;

            // 3D to 2D projection
            const perspective = 800;
            const scale = perspective / (perspective + arrow.z);

            arrow.screenX = 500 + (arrow.x - 500) * scale;
            arrow.screenY = 350 + (arrow.worldY - 70) * scale - (350 - target.y) * (1 - scale);
            arrow.scale = scale;

            // Calculate arrow angle based on velocity
            const screenVx = arrow.vx * scale;
            const screenVy = arrow.vy * scale - arrow.vz * 0.1; // Account for forward motion
            arrow.angle = Math.atan2(screenVy, -arrow.vz * scale + Math.abs(screenVx) * 0.1);

            // Add to trail
            arrowTrail.push({ screenX: arrow.screenX, screenY: arrow.screenY });
            if (arrowTrail.length > 20) arrowTrail.shift();

            // Check if arrow reached target
            if (arrow.z >= arrow.maxZ) {
                // Calculate final hit position
                const hitX = arrow.screenX;
                const hitY = arrow.screenY;

                // Calculate score
                const dx = hitX - target.x;
                const dy = hitY - target.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                let score = 0;
                for (let i = target.rings.length - 1; i >= 0; i--) {
                    if (distance <= target.baseRadius * target.rings[i].radius) {
                        score = target.rings[i].score;
                        break;
                    }
                }

                arrowsOnTarget.push({
                    x: hitX,
                    y: hitY,
                    player: currentPlayer,
                    score: score
                });

                players[currentPlayer].score += score;
                players[currentPlayer].currentArrows.push(score);
                players[currentPlayer].arrowsLeft--;

                arrow = null;
                arrowTrail = [];

                showCloseup(hitX, hitY, score);
            }

            // Check if arrow missed (went too far off screen or hit ground)
            if (arrow && (arrow.screenY > 600 || arrow.screenX < -100 || arrow.screenX > 1100)) {
                players[currentPlayer].currentArrows.push(0);
                players[currentPlayer].arrowsLeft--;

                arrow = null;
                arrowTrail = [];

                showCloseup(target.x, target.y + 200, 0);
            }
        }

        function showCloseup(hitX, hitY, score) {
            gameState = 'closeup';

            const overlay = document.getElementById('closeupOverlay');
            const scoreDisplay = document.getElementById('closeupScore');

            overlay.style.display = 'flex';
            scoreDisplay.textContent = score > 0 ? `${score}점!` : 'MISS!';
            scoreDisplay.style.color = score === 10 ? '#ff4444' : (score > 0 ? '#ffd700' : '#ff0000');

            drawCloseupTarget(hitX, hitY);

            setTimeout(() => {
                overlay.style.display = 'none';
                updateUI();
                nextTurn();
            }, 1500);
        }

        function drawCloseupTarget(hitX, hitY) {
            const ctx = closeupCtx;
            const size = 300;
            const centerX = size / 2;
            const centerY = size / 2;

            ctx.clearRect(0, 0, size, size);

            const scale = 2;
            const offsetX = (hitX - target.x) * scale;
            const offsetY = (hitY - target.y) * scale;

            target.rings.forEach((ring, i) => {
                const radius = target.baseRadius * ring.radius * scale;
                ctx.beginPath();
                ctx.arc(centerX - offsetX, centerY - offsetY, radius, 0, Math.PI * 2);
                ctx.fillStyle = ring.color;
                ctx.fill();
                ctx.strokeStyle = i < 2 ? '#ccc' : (ring.color === '#000' ? '#333' : '#000');
                ctx.lineWidth = 1;
                ctx.stroke();
            });

            // Arrow hit point
            ctx.beginPath();
            ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
            ctx.fillStyle = currentPlayer === 1 ? '#ff6b6b' : '#4ecdc4';
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Arrow shaft
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX + 25, centerY + 15);
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        function nextTurn() {
            if (players[1].arrowsLeft === 0 && players[2].arrowsLeft === 0) {
                endRound();
            } else if (players[currentPlayer].arrowsLeft === 0) {
                currentPlayer = currentPlayer === 1 ? 2 : 1;
                gameState = 'playing';
            } else {
                if (currentPlayer === 1 && players[2].arrowsLeft > 0) {
                    currentPlayer = 2;
                } else if (currentPlayer === 2 && players[1].arrowsLeft > 0) {
                    currentPlayer = 1;
                }
                gameState = 'playing';
            }
            updateUI();
        }

        function endRound() {
            const p1RoundScore = players[1].currentArrows.reduce((a, b) => a + b, 0);
            const p2RoundScore = players[2].currentArrows.reduce((a, b) => a + b, 0);

            players[1].roundScores.push(p1RoundScore);
            players[2].roundScores.push(p2RoundScore);

            if (p1RoundScore > p2RoundScore) {
                players[1].wins++;
            } else if (p2RoundScore > p1RoundScore) {
                players[2].wins++;
            }

            if (currentRound >= maxRounds) {
                endGame();
            } else {
                currentRound++;
                resetRound();
                currentPlayer = 1;
                gameState = 'playing';
                updateUI();
            }
        }

        function endGame() {
            gameState = 'result';

            const resultScreen = document.getElementById('resultScreen');
            resultScreen.style.display = 'flex';

            document.getElementById('finalP1').textContent = players[1].score;
            document.getElementById('finalP2').textContent = players[2].score;

            let winnerText, winnerEmoji;
            if (players[1].score > players[2].score) {
                winnerText = 'Player 1 승리!';
                winnerEmoji = '🔴';
            } else if (players[2].score > players[1].score) {
                winnerText = 'Player 2 승리!';
                winnerEmoji = '🔵';
            } else {
                winnerText = '무승부!';
                winnerEmoji = '🤝';
            }

            document.getElementById('winnerText').textContent = winnerText;
            document.getElementById('winnerEmoji').textContent = winnerEmoji;

            let roundDetails = '';
            for (let i = 0; i < maxRounds; i++) {
                const p1 = players[1].roundScores[i] || 0;
                const p2 = players[2].roundScores[i] || 0;
                const winner = p1 > p2 ? 'P1' : (p2 > p1 ? 'P2' : 'Draw');
                roundDetails += `Round ${i + 1}: P1(${p1}) vs P2(${p2}) - ${winner} | `;
            }
            document.getElementById('roundResults').textContent = roundDetails;
        }

        function updateUI() {
            document.getElementById('p1Score').textContent = players[1].score;
            document.getElementById('p2Score').textContent = players[2].score;
            document.getElementById('p1Arrows').textContent = players[1].arrowsLeft;
            document.getElementById('p2Arrows').textContent = players[2].arrowsLeft;
            document.getElementById('roundInfo').textContent = `라운드 ${currentRound} / ${maxRounds}`;

            document.getElementById('p1Panel').classList.toggle('active', currentPlayer === 1);
            document.getElementById('p2Panel').classList.toggle('active', currentPlayer === 2);

            updateArrowScores('p1ArrowScores', players[1].currentArrows);
            updateArrowScores('p2ArrowScores', players[2].currentArrows);

            if (gameState === 'playing') {
                document.getElementById('instructions').textContent =
                    `Player ${currentPlayer}: 클릭하고 드래그하여 조준 → 놓으면 발사!`;
            }
        }

        function updateArrowScores(elementId, arrows) {
            const container = document.getElementById(elementId);
            const divs = container.querySelectorAll('.arrow-score');
            divs.forEach((div, i) => {
                if (arrows[i] !== undefined) {
                    div.textContent = arrows[i];
                    div.classList.add('hit');
                    div.classList.toggle('ten', arrows[i] === 10);
                } else {
                    div.textContent = '-';
                    div.classList.remove('hit', 'ten');
                }
            });
        }

        // Main game loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState !== 'start' && gameState !== 'result') {
                drawBackground();
                drawTarget();
                drawWindIndicator();
                drawBow();
                drawCrosshair();
                drawFlyingArrow();
                drawPlayerIndicator();

                if (gameState === 'shooting') {
                    updateArrow();
                }

                if (isAiming) {
                    const elapsed = Date.now() - aimStartTime;
                    drawStrength = Math.min(elapsed / 25, maxDrawStrength);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // Event listeners
        canvas.addEventListener('mousedown', (e) => {
            if (gameState !== 'playing') return;

            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;

            isAiming = true;
            aimStartTime = Date.now();
            drawStrength = 0;
            swayTime = 0;
            gameState = 'aiming';
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const newMouseX = e.clientX - rect.left;
            const newMouseY = e.clientY - rect.top;

            if (isAiming) {
                mouseX = Math.max(300, Math.min(700, newMouseX));
                mouseY = Math.max(150, Math.min(400, newMouseY));
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (gameState !== 'aiming') return;

            if (drawStrength > 20) {
                shootArrow();
            } else {
                isAiming = false;
                gameState = 'playing';
            }
        });

        canvas.addEventListener('mouseleave', () => {
            if (gameState === 'aiming') {
                isAiming = false;
                drawStrength = 0;
                gameState = 'playing';
            }
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startScreen').style.display = 'none';
            gameState = 'playing';
            resetGame();
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('resultScreen').style.display = 'none';
            gameState = 'playing';
            resetGame();
        });

        // Start
        init();
    </script>
</body>
