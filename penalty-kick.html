<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penalty Kick Game - World Cup Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3f 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        /* Country Selection Screen */
        #country-selection {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #country-selection h1 {
            color: #ffd700;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #country-selection p {
            color: white;
            font-size: 1.5em;
            margin-bottom: 40px;
        }

        .country-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            max-width: 900px;
        }

        .country-btn {
            width: 150px;
            height: 120px;
            border: 3px solid #ffd700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
        }

        .country-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
        }

        .country-btn .flag {
            width: 80px;
            height: 53px;
            margin-bottom: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .country-btn span {
            color: white;
            font-weight: bold;
        }

        /* Game Screen */
        #game-screen {
            display: none;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* Scoreboard */
        .scoreboard {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 50;
        }

        .team-score {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
        }

        .team-score .flag-small {
            width: 50px;
            height: 33px;
            margin-right: 15px;
            border-radius: 3px;
        }

        .team-score .score {
            font-size: 2.5em;
            color: white;
            font-weight: bold;
            margin-left: 15px;
        }

        .team-score .team-name {
            color: white;
            font-size: 1.2em;
        }

        /* Round indicator */
        .round-indicator {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 30px;
            border-radius: 10px;
            color: white;
            font-size: 1.3em;
            z-index: 50;
        }

        /* Game Canvas */
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Message overlay */
        .message-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 200;
        }

        .message-overlay h2 {
            color: #ffd700;
            font-size: 4em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .message-overlay p {
            color: white;
            font-size: 2em;
            margin-bottom: 30px;
        }

        .message-overlay button {
            padding: 15px 40px;
            font-size: 1.5em;
            background: #ffd700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .message-overlay button:hover {
            transform: scale(1.1);
            background: #ffed4a;
        }

        /* Turn indicator */
        .turn-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 15px 30px;
            border-radius: 10px;
            color: white;
            font-size: 1.5em;
            z-index: 50;
        }

        /* Kick history */
        .kick-history {
            position: absolute;
            top: 130px;
            display: flex;
            gap: 5px;
            z-index: 50;
        }

        .kick-history.left {
            left: 20px;
        }

        .kick-history.right {
            right: 20px;
        }

        .kick-result {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2em;
        }

        .kick-result.goal {
            background: #4caf50;
            color: white;
        }

        .kick-result.miss {
            background: #f44336;
            color: white;
        }

        .kick-result.pending {
            background: #666;
            color: #999;
        }
    </style>
</head>
<body>
    <!-- Country Selection Screen -->
    <div id="country-selection">
        <h1>PENALTY SHOOTOUT</h1>
        <p>Select Your Country</p>
        <div class="country-grid" id="countryGrid"></div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen">
        <div class="scoreboard">
            <div class="team-score" id="player-team">
                <canvas class="flag-small" id="playerFlag"></canvas>
                <span class="team-name" id="playerName">Player</span>
                <span class="score" id="playerScore">0</span>
            </div>
            <div class="team-score" id="opponent-team">
                <span class="score" id="opponentScore">0</span>
                <span class="team-name" id="opponentName">Opponent</span>
                <canvas class="flag-small" id="opponentFlag"></canvas>
            </div>
        </div>

        <div class="round-indicator" id="roundIndicator">Round 1/5</div>

        <div class="kick-history left" id="playerHistory"></div>
        <div class="kick-history right" id="opponentHistory"></div>

        <canvas id="gameCanvas"></canvas>

        <div class="turn-indicator" id="turnIndicator">Your turn to KICK!</div>
    </div>

    <!-- Message Overlay -->
    <div class="message-overlay" id="messageOverlay">
        <h2 id="messageTitle">GOAL!</h2>
        <p id="messageText">Great shot!</p>
        <button id="continueBtn">Continue</button>
    </div>

    <!-- Final Result Overlay -->
    <div class="message-overlay" id="resultOverlay">
        <h2 id="resultTitle">YOU WIN!</h2>
        <p id="resultScore">3 - 2</p>
        <button id="restartBtn">Play Again</button>
    </div>

    <script>
        // Countries data with flag drawing functions
        const countries = {
            brazil: { name: 'Brazil', nameKr: '브라질' },
            portugal: { name: 'Portugal', nameKr: '포르투갈' },
            argentina: { name: 'Argentina', nameKr: '아르헨티나' },
            korea: { name: 'Korea', nameKr: '한국' },
            italy: { name: 'Italy', nameKr: '이탈리아' },
            france: { name: 'France', nameKr: '프랑스' },
            england: { name: 'England', nameKr: '잉글랜드' },
            netherlands: { name: 'Netherlands', nameKr: '네덜란드' },
            germany: { name: 'Germany', nameKr: '독일' },
            spain: { name: 'Spain', nameKr: '스페인' }
        };

        // Draw flag functions
        function drawFlag(ctx, country, width, height) {
            ctx.clearRect(0, 0, width, height);

            switch(country) {
                case 'brazil':
                    ctx.fillStyle = '#009c3b';
                    ctx.fillRect(0, 0, width, height);
                    ctx.fillStyle = '#ffdf00';
                    ctx.beginPath();
                    ctx.moveTo(width/2, height*0.1);
                    ctx.lineTo(width*0.95, height/2);
                    ctx.lineTo(width/2, height*0.9);
                    ctx.lineTo(width*0.05, height/2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#002776';
                    ctx.beginPath();
                    ctx.arc(width/2, height/2, height*0.25, 0, Math.PI*2);
                    ctx.fill();
                    break;

                case 'portugal':
                    ctx.fillStyle = '#006600';
                    ctx.fillRect(0, 0, width*0.4, height);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(width*0.4, 0, width*0.6, height);
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath();
                    ctx.arc(width*0.4, height/2, height*0.3, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(width*0.4, height/2, height*0.2, 0, Math.PI*2);
                    ctx.fill();
                    break;

                case 'argentina':
                    ctx.fillStyle = '#74acdf';
                    ctx.fillRect(0, 0, width, height/3);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, height/3, width, height/3);
                    ctx.fillStyle = '#74acdf';
                    ctx.fillRect(0, height*2/3, width, height/3);
                    ctx.fillStyle = '#f6b40e';
                    ctx.beginPath();
                    ctx.arc(width/2, height/2, height*0.15, 0, Math.PI*2);
                    ctx.fill();
                    break;

                case 'korea':
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, width, height);
                    ctx.fillStyle = '#cd2e3a';
                    ctx.beginPath();
                    ctx.arc(width/2, height/2, height*0.3, 0, Math.PI, true);
                    ctx.fill();
                    ctx.fillStyle = '#0047a0';
                    ctx.beginPath();
                    ctx.arc(width/2, height/2, height*0.3, 0, Math.PI, false);
                    ctx.fill();
                    ctx.fillStyle = '#cd2e3a';
                    ctx.beginPath();
                    ctx.arc(width/2 - height*0.15, height/2, height*0.15, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#0047a0';
                    ctx.beginPath();
                    ctx.arc(width/2 + height*0.15, height/2, height*0.15, 0, Math.PI*2);
                    ctx.fill();
                    break;

                case 'italy':
                    ctx.fillStyle = '#009246';
                    ctx.fillRect(0, 0, width/3, height);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(width/3, 0, width/3, height);
                    ctx.fillStyle = '#ce2b37';
                    ctx.fillRect(width*2/3, 0, width/3, height);
                    break;

                case 'france':
                    ctx.fillStyle = '#002395';
                    ctx.fillRect(0, 0, width/3, height);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(width/3, 0, width/3, height);
                    ctx.fillStyle = '#ed2939';
                    ctx.fillRect(width*2/3, 0, width/3, height);
                    break;

                case 'england':
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, width, height);
                    ctx.fillStyle = '#ce1124';
                    ctx.fillRect(width*0.42, 0, width*0.16, height);
                    ctx.fillRect(0, height*0.38, width, height*0.24);
                    break;

                case 'netherlands':
                    ctx.fillStyle = '#ae1c28';
                    ctx.fillRect(0, 0, width, height/3);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, height/3, width, height/3);
                    ctx.fillStyle = '#21468b';
                    ctx.fillRect(0, height*2/3, width, height/3);
                    break;

                case 'germany':
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(0, 0, width, height/3);
                    ctx.fillStyle = '#dd0000';
                    ctx.fillRect(0, height/3, width, height/3);
                    ctx.fillStyle = '#ffcc00';
                    ctx.fillRect(0, height*2/3, width, height/3);
                    break;

                case 'spain':
                    ctx.fillStyle = '#c60b1e';
                    ctx.fillRect(0, 0, width, height*0.25);
                    ctx.fillStyle = '#ffc400';
                    ctx.fillRect(0, height*0.25, width, height*0.5);
                    ctx.fillStyle = '#c60b1e';
                    ctx.fillRect(0, height*0.75, width, height*0.25);
                    break;
            }
        }

        // Game State
        let gameState = {
            playerCountry: null,
            opponentCountry: null,
            playerScore: 0,
            opponentScore: 0,
            currentRound: 1,
            maxRounds: 5,
            isPlayerKicking: true,
            playerKicks: [],
            opponentKicks: [],
            gamePhase: 'selection', // selection, kicking, defending, result
            isAnimating: false,
            isSuddenDeath: false
        };

        // Canvas and context
        let canvas, ctx;
        let canvasWidth, canvasHeight;

        // Ball state
        let ball = {
            x: 0,
            y: 0,
            targetX: 0,
            targetY: 0,
            isMoving: false,
            startX: 0,
            startY: 0
        };

        // Goalkeeper state
        let goalkeeper = {
            x: 0,
            y: 0,
            targetX: 0,
            targetY: 0,
            width: 60,
            height: 100,
            isMoving: false,
            direction: 'center' // left, center, right
        };

        // Arrow state
        let arrow = {
            isAiming: false,
            startX: 0,
            startY: 0,
            endX: 0,
            endY: 0
        };

        // Goal dimensions
        let goal = {
            x: 0,
            y: 0,
            width: 0,
            height: 0
        };

        // Initialize country selection
        function initCountrySelection() {
            const grid = document.getElementById('countryGrid');
            grid.innerHTML = '';

            Object.keys(countries).forEach(key => {
                const btn = document.createElement('div');
                btn.className = 'country-btn';
                btn.innerHTML = `
                    <canvas class="flag" id="flag-${key}" width="80" height="53"></canvas>
                    <span>${countries[key].nameKr}</span>
                `;
                btn.onclick = () => selectCountry(key);
                grid.appendChild(btn);

                // Draw flag after element is added
                setTimeout(() => {
                    const flagCanvas = document.getElementById(`flag-${key}`);
                    if (flagCanvas) {
                        const flagCtx = flagCanvas.getContext('2d');
                        drawFlag(flagCtx, key, 80, 53);
                    }
                }, 10);
            });
        }

        // Select country and start game
        function selectCountry(country) {
            gameState.playerCountry = country;

            // Select random opponent
            const availableCountries = Object.keys(countries).filter(c => c !== country);
            gameState.opponentCountry = availableCountries[Math.floor(Math.random() * availableCountries.length)];

            // Hide selection, show game
            document.getElementById('country-selection').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            // Update team displays
            document.getElementById('playerName').textContent = countries[gameState.playerCountry].nameKr;
            document.getElementById('opponentName').textContent = countries[gameState.opponentCountry].nameKr;

            // Draw flags
            const playerFlagCanvas = document.getElementById('playerFlag');
            const opponentFlagCanvas = document.getElementById('opponentFlag');
            playerFlagCanvas.width = 50;
            playerFlagCanvas.height = 33;
            opponentFlagCanvas.width = 50;
            opponentFlagCanvas.height = 33;

            drawFlag(playerFlagCanvas.getContext('2d'), gameState.playerCountry, 50, 33);
            drawFlag(opponentFlagCanvas.getContext('2d'), gameState.opponentCountry, 50, 33);

            // Initialize game
            initGame();
        }

        // Initialize game canvas
        function initGame() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Event listeners
            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('touchstart', onTouchStart);
            canvas.addEventListener('touchmove', onTouchMove);
            canvas.addEventListener('touchend', onTouchEnd);

            // Button listeners
            document.getElementById('continueBtn').onclick = continueGame;
            document.getElementById('restartBtn').onclick = restartGame;

            // Start game
            resetPositions();
            updateUI();
            gameLoop();
        }

        function resizeCanvas() {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;

            // Update goal dimensions
            goal.width = canvasWidth * 0.4;
            goal.height = canvasHeight * 0.35;
            goal.x = (canvasWidth - goal.width) / 2;
            goal.y = canvasHeight * 0.08;

            resetPositions();
        }

        function resetPositions() {
            // Ball position (penalty spot)
            ball.x = canvasWidth / 2;
            ball.y = canvasHeight * 0.75;
            ball.startX = ball.x;
            ball.startY = ball.y;
            ball.isMoving = false;

            // Goalkeeper position
            goalkeeper.x = canvasWidth / 2;
            goalkeeper.y = goal.y + goal.height - goalkeeper.height/2 - 10;
            goalkeeper.isMoving = false;
        }

        function getGoalZone(x, y) {
            // Divide goal into 9 zones (3x3)
            const zoneWidth = goal.width / 3;
            const zoneHeight = goal.height / 3;

            let col = Math.floor((x - goal.x) / zoneWidth);
            let row = Math.floor((y - goal.y) / zoneHeight);

            col = Math.max(0, Math.min(2, col));
            row = Math.max(0, Math.min(2, row));

            return { col, row, zone: row * 3 + col };
        }

        function getKeeperCoverage(direction) {
            // Keeper covers 2-3 zones based on direction
            // direction: 0=left, 1=center, 2=right
            const coverages = {
                0: [0, 1, 3, 4], // left: covers left and center-left zones
                1: [1, 3, 4, 5, 7], // center: covers middle column
                2: [1, 2, 4, 5], // right: covers right and center-right zones
            };
            return coverages[direction];
        }

        // Mouse/Touch events
        function onMouseDown(e) {
            if (gameState.isAnimating || !gameState.isPlayerKicking) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Check if clicking near ball
            const dist = Math.sqrt((x - ball.x) ** 2 + (y - ball.y) ** 2);
            if (dist < 50) {
                arrow.isAiming = true;
                arrow.startX = ball.x;
                arrow.startY = ball.y;
                arrow.endX = x;
                arrow.endY = y;
            }
        }

        function onMouseMove(e) {
            if (!arrow.isAiming) return;

            const rect = canvas.getBoundingClientRect();
            arrow.endX = e.clientX - rect.left;
            arrow.endY = e.clientY - rect.top;

            // Clamp to goal area
            arrow.endX = Math.max(goal.x, Math.min(goal.x + goal.width, arrow.endX));
            arrow.endY = Math.max(goal.y, Math.min(goal.y + goal.height, arrow.endY));
        }

        function onMouseUp(e) {
            if (!arrow.isAiming) return;

            arrow.isAiming = false;

            // Check if target is in goal area
            if (arrow.endX >= goal.x && arrow.endX <= goal.x + goal.width &&
                arrow.endY >= goal.y && arrow.endY <= goal.y + goal.height) {
                shootBall(arrow.endX, arrow.endY);
            }
        }

        // Touch events
        function onTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            onMouseDown({ clientX: touch.clientX, clientY: touch.clientY });
        }

        function onTouchMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            onMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
        }

        function onTouchEnd(e) {
            e.preventDefault();
            onMouseUp({});
        }

        // Shoot ball
        function shootBall(targetX, targetY) {
            gameState.isAnimating = true;

            ball.targetX = targetX;
            ball.targetY = targetY;
            ball.isMoving = true;

            // Goalkeeper jumps randomly
            const keeperDirection = Math.floor(Math.random() * 3); // 0=left, 1=center, 2=right
            goalkeeper.direction = keeperDirection;

            const keeperTargets = [
                { x: goal.x + goal.width * 0.2, y: goalkeeper.y - 30 },
                { x: canvasWidth / 2, y: goalkeeper.y - 20 },
                { x: goal.x + goal.width * 0.8, y: goalkeeper.y - 30 }
            ];

            goalkeeper.targetX = keeperTargets[keeperDirection].x;
            goalkeeper.targetY = keeperTargets[keeperDirection].y;
            goalkeeper.isMoving = true;

            // Check result after animation
            setTimeout(() => {
                checkKickResult(targetX, targetY, keeperDirection, true);
            }, 800);
        }

        function checkKickResult(ballX, ballY, keeperDir, isPlayer) {
            const zone = getGoalZone(ballX, ballY);
            const coverage = getKeeperCoverage(keeperDir);

            const isGoal = !coverage.includes(zone.zone);

            if (isPlayer) {
                gameState.playerKicks.push(isGoal);
                if (isGoal) gameState.playerScore++;
            } else {
                gameState.opponentKicks.push(isGoal);
                if (isGoal) gameState.opponentScore++;
            }

            updateUI();
            showKickResult(isGoal, isPlayer);
        }

        function showKickResult(isGoal, isPlayer) {
            const overlay = document.getElementById('messageOverlay');
            const title = document.getElementById('messageTitle');
            const text = document.getElementById('messageText');

            if (isGoal) {
                title.textContent = 'GOAL!';
                title.style.color = '#4caf50';
                text.textContent = isPlayer ? 'Great shot!' : 'They scored!';
            } else {
                title.textContent = 'SAVED!';
                title.style.color = '#f44336';
                text.textContent = isPlayer ? 'The keeper got it!' : 'You saved it!';
            }

            overlay.style.display = 'flex';
        }

        function continueGame() {
            document.getElementById('messageOverlay').style.display = 'none';

            // Check if game is over
            if (checkGameOver()) {
                showFinalResult();
                return;
            }

            // Switch turn
            gameState.isPlayerKicking = !gameState.isPlayerKicking;

            // Update round
            if (gameState.isPlayerKicking) {
                gameState.currentRound++;
            }

            // Reset positions
            resetPositions();
            gameState.isAnimating = false;

            updateUI();

            // If opponent's turn to kick, simulate their kick
            if (!gameState.isPlayerKicking) {
                setTimeout(simulateOpponentKick, 1000);
            }
        }

        function simulateOpponentKick() {
            gameState.isAnimating = true;

            // Random target in goal
            const targetX = goal.x + goal.width * (0.15 + Math.random() * 0.7);
            const targetY = goal.y + goal.height * (0.2 + Math.random() * 0.6);

            ball.targetX = targetX;
            ball.targetY = targetY;
            ball.isMoving = true;

            // Player (as keeper) jumps randomly
            const keeperDirection = Math.floor(Math.random() * 3);
            goalkeeper.direction = keeperDirection;

            const keeperTargets = [
                { x: goal.x + goal.width * 0.2, y: goalkeeper.y - 30 },
                { x: canvasWidth / 2, y: goalkeeper.y - 20 },
                { x: goal.x + goal.width * 0.8, y: goalkeeper.y - 30 }
            ];

            goalkeeper.targetX = keeperTargets[keeperDirection].x;
            goalkeeper.targetY = keeperTargets[keeperDirection].y;
            goalkeeper.isMoving = true;

            setTimeout(() => {
                checkKickResult(targetX, targetY, keeperDirection, false);
            }, 800);
        }

        function checkGameOver() {
            const playerKicks = gameState.playerKicks.length;
            const opponentKicks = gameState.opponentKicks.length;
            const playerGoals = gameState.playerScore;
            const opponentGoals = gameState.opponentScore;

            // Both completed 5 kicks
            if (playerKicks >= 5 && opponentKicks >= 5) {
                // If tied, go to sudden death
                if (playerGoals === opponentGoals) {
                    if (!gameState.isSuddenDeath) {
                        gameState.isSuddenDeath = true;
                    }
                    // In sudden death, check after each pair
                    if (playerKicks === opponentKicks && playerGoals !== opponentGoals) {
                        return true;
                    }
                    return false;
                }
                return true;
            }

            // Early win check (opponent can't catch up)
            const playerRemaining = gameState.isSuddenDeath ? 1 : Math.max(0, 5 - playerKicks);
            const opponentRemaining = gameState.isSuddenDeath ? 1 : Math.max(0, 5 - opponentKicks);

            if (playerGoals > opponentGoals + opponentRemaining && opponentKicks >= playerKicks) {
                return true;
            }
            if (opponentGoals > playerGoals + playerRemaining && playerKicks >= opponentKicks) {
                return true;
            }

            return false;
        }

        function showFinalResult() {
            const overlay = document.getElementById('resultOverlay');
            const title = document.getElementById('resultTitle');
            const score = document.getElementById('resultScore');

            if (gameState.playerScore > gameState.opponentScore) {
                title.textContent = 'YOU WIN!';
                title.style.color = '#4caf50';
            } else {
                title.textContent = 'YOU LOSE!';
                title.style.color = '#f44336';
            }

            score.textContent = `${gameState.playerScore} - ${gameState.opponentScore}`;
            overlay.style.display = 'flex';
        }

        function restartGame() {
            // Reset game state
            gameState = {
                playerCountry: null,
                opponentCountry: null,
                playerScore: 0,
                opponentScore: 0,
                currentRound: 1,
                maxRounds: 5,
                isPlayerKicking: true,
                playerKicks: [],
                opponentKicks: [],
                gamePhase: 'selection',
                isAnimating: false,
                isSuddenDeath: false
            };

            // Show country selection
            document.getElementById('resultOverlay').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('country-selection').style.display = 'flex';

            initCountrySelection();
        }

        function updateUI() {
            document.getElementById('playerScore').textContent = gameState.playerScore;
            document.getElementById('opponentScore').textContent = gameState.opponentScore;

            if (gameState.isSuddenDeath) {
                document.getElementById('roundIndicator').textContent = 'SUDDEN DEATH!';
            } else {
                document.getElementById('roundIndicator').textContent = `Round ${Math.min(gameState.currentRound, 5)}/5`;
            }

            if (gameState.isPlayerKicking) {
                document.getElementById('turnIndicator').textContent = 'Your turn to KICK!';
            } else {
                document.getElementById('turnIndicator').textContent = 'Your turn to DEFEND!';
            }

            // Update kick history
            updateKickHistory();
        }

        function updateKickHistory() {
            const playerHistory = document.getElementById('playerHistory');
            const opponentHistory = document.getElementById('opponentHistory');

            playerHistory.innerHTML = '';
            opponentHistory.innerHTML = '';

            const totalKicks = gameState.isSuddenDeath ? Math.max(gameState.playerKicks.length, 6) : 5;

            for (let i = 0; i < totalKicks; i++) {
                // Player
                const playerDiv = document.createElement('div');
                playerDiv.className = 'kick-result ';
                if (i < gameState.playerKicks.length) {
                    playerDiv.className += gameState.playerKicks[i] ? 'goal' : 'miss';
                    playerDiv.textContent = gameState.playerKicks[i] ? 'O' : 'X';
                } else {
                    playerDiv.className += 'pending';
                    playerDiv.textContent = '-';
                }
                playerHistory.appendChild(playerDiv);

                // Opponent
                const opponentDiv = document.createElement('div');
                opponentDiv.className = 'kick-result ';
                if (i < gameState.opponentKicks.length) {
                    opponentDiv.className += gameState.opponentKicks[i] ? 'goal' : 'miss';
                    opponentDiv.textContent = gameState.opponentKicks[i] ? 'O' : 'X';
                } else {
                    opponentDiv.className += 'pending';
                    opponentDiv.textContent = '-';
                }
                opponentHistory.appendChild(opponentDiv);
            }
        }

        // Game loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            drawField();
            drawGoal();
            drawGoalkeeper();
            drawPlayer();
            drawBall();
            drawArrow();

            // Update ball position
            if (ball.isMoving) {
                const dx = ball.targetX - ball.x;
                const dy = ball.targetY - ball.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 5) {
                    ball.x += dx * 0.1;
                    ball.y += dy * 0.1;
                } else {
                    ball.isMoving = false;
                }
            }

            // Update goalkeeper position
            if (goalkeeper.isMoving) {
                const dx = goalkeeper.targetX - goalkeeper.x;
                const dy = goalkeeper.targetY - goalkeeper.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 5) {
                    goalkeeper.x += dx * 0.15;
                    goalkeeper.y += dy * 0.15;
                } else {
                    goalkeeper.isMoving = false;
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function drawField() {
            // Grass
            ctx.fillStyle = '#2e8b57';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // Grass stripes
            ctx.fillStyle = '#3a9d63';
            for (let i = 0; i < canvasHeight; i += 40) {
                if ((i / 40) % 2 === 0) {
                    ctx.fillRect(0, i, canvasWidth, 20);
                }
            }

            // Penalty area
            const penaltyWidth = goal.width * 1.8;
            const penaltyHeight = canvasHeight * 0.5;
            const penaltyX = (canvasWidth - penaltyWidth) / 2;

            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3;
            ctx.strokeRect(penaltyX, 0, penaltyWidth, penaltyHeight);

            // Goal area
            const goalAreaWidth = goal.width * 1.2;
            const goalAreaHeight = canvasHeight * 0.25;
            const goalAreaX = (canvasWidth - goalAreaWidth) / 2;
            ctx.strokeRect(goalAreaX, 0, goalAreaWidth, goalAreaHeight);

            // Penalty spot
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(ball.startX, ball.startY, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawGoal() {
            // Goal net (background)
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(goal.x, goal.y, goal.width, goal.height);

            // Net pattern
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 1;

            const gridSize = 20;
            for (let x = goal.x; x <= goal.x + goal.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, goal.y);
                ctx.lineTo(x, goal.y + goal.height);
                ctx.stroke();
            }
            for (let y = goal.y; y <= goal.y + goal.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(goal.x, y);
                ctx.lineTo(goal.x + goal.width, y);
                ctx.stroke();
            }

            // Goal posts
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 8;
            ctx.strokeRect(goal.x, goal.y, goal.width, goal.height);
        }

        function drawGoalkeeper() {
            const gk = goalkeeper;

            // Body
            ctx.fillStyle = '#ff6b00';
            ctx.fillRect(gk.x - 20, gk.y - 30, 40, 50);

            // Head
            ctx.fillStyle = '#ffd699';
            ctx.beginPath();
            ctx.arc(gk.x, gk.y - 45, 15, 0, Math.PI * 2);
            ctx.fill();

            // Arms
            ctx.fillStyle = '#ff6b00';
            const armAngle = goalkeeper.isMoving ?
                (goalkeeper.direction === 0 ? -0.8 : goalkeeper.direction === 2 ? 0.8 : 0) : 0;

            // Left arm
            ctx.save();
            ctx.translate(gk.x - 20, gk.y - 20);
            ctx.rotate(-0.5 + armAngle);
            ctx.fillRect(-30, -5, 30, 10);
            ctx.restore();

            // Right arm
            ctx.save();
            ctx.translate(gk.x + 20, gk.y - 20);
            ctx.rotate(0.5 + armAngle);
            ctx.fillRect(0, -5, 30, 10);
            ctx.restore();

            // Gloves
            ctx.fillStyle = '#00aa00';
            ctx.beginPath();
            ctx.arc(gk.x - 45 + armAngle * 20, gk.y - 25, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(gk.x + 45 + armAngle * 20, gk.y - 25, 10, 0, Math.PI * 2);
            ctx.fill();

            // Legs
            ctx.fillStyle = '#333';
            ctx.fillRect(gk.x - 15, gk.y + 20, 12, 30);
            ctx.fillRect(gk.x + 3, gk.y + 20, 12, 30);
        }

        function drawPlayer() {
            // Only draw kicker when it's player's turn
            if (!gameState.isPlayerKicking && !ball.isMoving) return;

            const px = ball.startX - 30;
            const py = ball.startY + 40;

            // Draw based on selected country colors
            const colors = getCountryColors(gameState.isPlayerKicking ? gameState.playerCountry : gameState.opponentCountry);

            // Body (jersey)
            ctx.fillStyle = colors.primary;
            ctx.fillRect(px - 15, py - 50, 30, 40);

            // Head
            ctx.fillStyle = '#ffd699';
            ctx.beginPath();
            ctx.arc(px, py - 65, 15, 0, Math.PI * 2);
            ctx.fill();

            // Shorts
            ctx.fillStyle = colors.secondary;
            ctx.fillRect(px - 12, py - 10, 24, 20);

            // Legs
            ctx.fillStyle = '#ffd699';
            ctx.fillRect(px - 10, py + 10, 8, 25);
            ctx.fillRect(px + 2, py + 10, 8, 25);

            // Shoes
            ctx.fillStyle = '#111';
            ctx.fillRect(px - 12, py + 35, 12, 8);
            ctx.fillRect(px, py + 35, 12, 8);
        }

        function getCountryColors(country) {
            const colorMap = {
                brazil: { primary: '#ffdf00', secondary: '#009c3b' },
                portugal: { primary: '#ff0000', secondary: '#006600' },
                argentina: { primary: '#74acdf', secondary: '#000' },
                korea: { primary: '#cd2e3a', secondary: '#0047a0' },
                italy: { primary: '#0066cc', secondary: '#fff' },
                france: { primary: '#0055a4', secondary: '#fff' },
                england: { primary: '#fff', secondary: '#00247d' },
                netherlands: { primary: '#ff6600', secondary: '#000' },
                germany: { primary: '#fff', secondary: '#000' },
                spain: { primary: '#ff0000', secondary: '#0000aa' }
            };
            return colorMap[country] || { primary: '#fff', secondary: '#000' };
        }

        function drawBall() {
            ctx.save();
            ctx.translate(ball.x, ball.y);

            // Ball shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(3, 15, 12, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Ball
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fill();

            // Ball pattern
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(-8, -5, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(8, -5, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(-5, 8, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(5, 8, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawArrow() {
            if (!arrow.isAiming) return;

            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 10]);

            ctx.beginPath();
            ctx.moveTo(arrow.startX, arrow.startY);
            ctx.lineTo(arrow.endX, arrow.endY);
            ctx.stroke();

            ctx.setLineDash([]);

            // Arrow head
            const angle = Math.atan2(arrow.endY - arrow.startY, arrow.endX - arrow.startX);
            const headLen = 20;

            ctx.beginPath();
            ctx.moveTo(arrow.endX, arrow.endY);
            ctx.lineTo(
                arrow.endX - headLen * Math.cos(angle - Math.PI / 6),
                arrow.endY - headLen * Math.sin(angle - Math.PI / 6)
            );
            ctx.moveTo(arrow.endX, arrow.endY);
            ctx.lineTo(
                arrow.endX - headLen * Math.cos(angle + Math.PI / 6),
                arrow.endY - headLen * Math.sin(angle + Math.PI / 6)
            );
            ctx.stroke();

            // Target circle
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(arrow.endX, arrow.endY, 20, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Start the game
        initCountrySelection();
    </script>
